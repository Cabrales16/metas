<div class="shell">
  <header class="top-bar">
    <span class="brand">Metas</span>
    <button type="button" class="icon-btn" aria-label="Cerrar sesión" (click)="cerrarSesion()">
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>
    </button>
  </header>

  <nav class="side-nav" aria-label="Navegación principal">
    <div class="brand">Metas</div>
    @for (s of secciones; track s.ruta) {
      <a class="nav-item" [routerLink]="s.ruta" routerLinkActive="active">
        <span class="material-symbols-outlined" aria-hidden="true">{{ s.icono }}</span>
        <span>{{ s.etiqueta }}</span>
      </a>
    }
    <button type="button" class="nav-item logout" (click)="cerrarSesion()">
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>
      <span>Cerrar sesión</span>
    </button>
  </nav>

  <main class="content">
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    @for (s of secciones; track s.ruta) {
      <a class="nav-item" [routerLink]="s.ruta" routerLinkActive="active">
        <span class="material-symbols-outlined" aria-hidden="true">{{ s.icono }}</span>
        <span>{{ s.etiqueta }}</span>
      </a>
    }
  </nav>
</div>
